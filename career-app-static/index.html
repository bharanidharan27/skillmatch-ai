<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SkillMatch AI — Intelligent Career Role Matching</title>
    <meta name="description" content="Multi-agent career role matching and skill gap mining system. CSE-572 Data Mining project at Arizona State University." />
    <meta property="og:title" content="SkillMatch AI" />
    <meta property="og:description" content="Intelligent Multi-Agent Career Role Matching & Skill Gap Mining" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Apply saved theme before paint to avoid flash
      (function(){
        var saved = localStorage.getItem('skillmatch-theme');
        if(saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          // Default to dark
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DSsGtbA1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DTtYguQY.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Theme toggle button -->
    <button
      id="theme-toggle"
      aria-label="Toggle light/dark mode"
      title="Toggle light/dark mode"
      style="
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 9999;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(128,128,128,0.25);
        background: rgba(128,128,128,0.12);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        line-height: 1;
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
        box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      "
      onmouseover="this.style.transform='scale(1.1)'"
      onmouseout="this.style.transform='scale(1)'"
    >
      <span id="theme-icon">🌙</span>
    </button>

    <script>
      (function(){
        var btn = document.getElementById('theme-toggle');
        var icon = document.getElementById('theme-icon');
        var html = document.documentElement;

        function isDark() {
          return html.classList.contains('dark');
        }

        function updateIcon() {
          icon.textContent = isDark() ? '🌙' : '☀️';
          // Adjust button bg based on theme
          btn.style.background = isDark()
            ? 'rgba(255,255,255,0.08)'
            : 'rgba(0,0,0,0.06)';
          btn.style.borderColor = isDark()
            ? 'rgba(255,255,255,0.15)'
            : 'rgba(0,0,0,0.12)';
        }

        // Set initial icon
        updateIcon();

        btn.addEventListener('click', function(){
          if(isDark()) {
            html.classList.remove('dark');
            localStorage.setItem('skillmatch-theme', 'light');
          } else {
            html.classList.add('dark');
            localStorage.setItem('skillmatch-theme', 'dark');
          }
          updateIcon();
        });
      })();
    </script>
  <script data-pplx-inline-edit>
(function(){
  if(window===window.top)return;
  function inlineAll(orig,clone){
    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;
      if(st&&st.indexOf('url(')>=0){
        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;
    try{
      var clone=document.documentElement.cloneNode(true);
      var rm=clone.querySelectorAll('script,link[rel="stylesheet"],style');
      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
</script></body>
</html>
